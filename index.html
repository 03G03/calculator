<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley's Calculator</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>

<body>
    <div class="page">
        <h1 id="title">Coquette Theme Calculator</h1>
        <div class="section-calculator">
            <div class="content" id="display-box"></div>
            <div id="buttons">
                <div class="content">
                    <button>clear</button>
                    <button>backspace</button>
                </div>
                <div class="content">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>+</button>
                </div>
                <div class="content">
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>-</button>
                </div>
                <div class="content">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>x</button>
                </div>
                <div class="content">
                    <button>.</button>
                    <button>0</button>
                    <button>=</button>
                    <button>:</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
